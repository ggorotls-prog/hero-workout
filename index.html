<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>💪 히어로 운동 챌린지</title>
<link rel="preconnect" href="https://trlnatdkebjvgiqneulv.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --red: #e06666; --pink: #f4cccc; --done: #f9cb9c; --zero: #b7e1cd; --left: #e69138;
    --line: #c9c9c9; --ink: #111; --sub: #555; --bg: #faf7f5; --card: #fff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: 'Noto Sans KR', sans-serif; font-weight: 500;
         -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 16px; text-align: center; }

  .card { background: var(--card); border-radius: 14px; padding: 16px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  label { font-size: 13px; color: var(--sub); display: block; margin-bottom: 4px; }
  select, input[type=date] { width: 100%; font: inherit; font-size: 16px; padding: 10px;
          border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; cursor: pointer; }
  .go { background: var(--red); color: #fff; padding: 12px 20px; font-size: 16px; }
  .go:disabled { opacity: .5; cursor: wait; }
  .msg { margin-top: 10px; font-size: 15px; min-height: 1.4em; }
  .msg.ok { color: #2e7d32; } .msg.err { color: #c62828; }
  .cheer { font-weight: 700; line-height: 1.5; color: #2e7d32; }
  .verse { margin-top: 10px; border-radius: 10px; padding: 10px 12px; font-weight: 500; line-height: 1.6;
           background: #eef4fb; color: #18406b; font-size: 15px; text-align: left; }
  .verse cite { display: block; text-align: right; font-style: normal; font-size: 12px; margin-top: 4px; }
  .verse.done { background: #e3f4ea; color: #0f4d2c; }
  .verse.rest { background: #f1f1f1; color: #444; }
  @media (max-width: 560px) { .form { grid-template-columns: 1fr; } .go { width: 100%; } }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .nav { background: #eee; color: var(--ink); padding: 8px 12px; }
  .nav:disabled { opacity: .35; cursor: default; }
  .wk { font-weight: 700; }
  .save { background: #333; color: #fff; padding: 8px 14px; }

  /* 내 기록 카드 (참가자는 자기 것만 본다) */
  .hint { color: var(--sub); text-align: center; padding: 18px 0; margin: 0; }
  .score { text-align: center; margin: 6px 0 4px; }
  .score b { font-size: 42px; font-weight: 800; }
  .score span { font-size: 18px; color: var(--sub); font-weight: 700; }
  .status { text-align: center; border-radius: 12px; padding: 12px; margin: 10px 0 14px; }
  .status .t { font-size: 18px; font-weight: 800; }
  .status .u { font-size: 14px; margin-top: 4px; }
  .status.good { background: #e3f4ea; color: #0f4d2c; }
  .status.safe { background: #eef4fb; color: #18406b; }
  .status.warn { background: #ffe0c2; color: #8a3d00; }
  .status.bad  { background: #fde2e2; color: #8a1c1c; }
  .week7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { text-align: center; }
  .day .w { font-size: 13px; color: var(--sub); }
  .day .c { margin: 4px auto 0; width: 100%; max-width: 52px; aspect-ratio: 1; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
            background: #f1f1f1; color: #888; }
  .day.on .c { background: var(--done); color: #4a2300; font-size: 22px; font-weight: 800; }
  .day.today .c { box-shadow: 0 0 0 3px var(--red); }
  .day.future .c { background: #fafafa; color: #bbb; border: 1px dashed #ddd; }

  /* 전체 표는 「전체 표 보기」를 누르면 누구나 */
  /* 결단 바꾸기 + 기수 주차별 결과 */
  .goalrow { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; font-size: 15px; }
  .goalrow .chg { background: #eee; color: var(--ink); padding: 6px 12px; font-size: 14px; }
  .picker { display: none; text-align: center; margin-top: 10px; }
  .picker.show { display: block; }
  .picker .chips { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
  .picker .chips button { width: 44px; height: 44px; background: #f1f1f1; font-size: 16px; }
  .picker .chips button.cur { background: var(--red); color: #fff; }
  .picker p { margin: 4px 0 0; font-size: 13px; color: var(--sub); }
  .hist { margin-top: 18px; border-top: 1px dashed #ddd; padding-top: 12px; }
  .hist h3 { font-size: 15px; margin: 0 0 8px; text-align: center; }
  .hist .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 10px; margin-bottom: 6px; background: #f7f7f7; font-size: 15px; }
  .hist .row small { color: var(--sub); font-size: 12px; margin-left: 4px; }
  .hist .row.ok { background: #e3f4ea; } .hist .row.ok b { color: #0f6b3a; }
  .hist .row.no { background: #fde2e2; } .hist .row.no b { color: #8a1c1c; }
  .hist .row.now b { color: #18406b; }
  .hist .row.off { background: #eef4fb; } .hist .row.off b { color: #18406b; }
  .picker .chips button.offbtn { width: 56px; font-size: 14px; }
  .picker .chips button.offbtn.cur { background: #4a7bb7; }
  .adminCard { display: none; }
  .showAll .adminCard { display: block; }
  .allbtn { display: block; width: 100%; background: #333; color: #fff; padding: 12px; font-size: 16px; margin-bottom: 16px; }
  .adminCard h2 { font-size: 17px; margin: 0 0 10px; }

  .scroll { overflow-x: auto; }
  #board { background: #fff; display: inline-block; min-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 17px; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--line); height: 40px; padding: 0 10px; text-align: center; white-space: nowrap; }
  .title td { background: var(--red); color: #fff; font-size: 23px; font-weight: 800; height: 60px; border-color: var(--red); }
  .title td.blank { background: #fff; border-color: var(--line); }
  thead th { background: var(--pink); font-weight: 800; font-size: 16px; color: #3b1414; }
  td.name { font-weight: 700; }
  td.goal { text-align: center; color: #333; font-weight: 500; }
  td.d { min-width: 76px; }
  td.d.on { background: var(--done); font-weight: 800; color: #4a2300; }
  th.today { background: #eaa3a3; }
  /* 시트 표처럼 굵은 줄: 제목 아래, 머리줄 아래, 이름|결단, 날짜 칸 양옆, 남은 횟수 오른쪽, 표 맨 아래 */
  table { --bold: 2px solid #111; }
  .title td { border-bottom: var(--bold); }
  thead tr:last-child th { border-bottom: var(--bold); }
  thead tr:last-child th:nth-child(2), tbody td:nth-child(2),
  thead tr:last-child th:nth-child(3), tbody td:nth-child(3) { border-left: var(--bold); }
  thead tr:last-child th:last-child, tbody td.rest { border-left: var(--bold); border-right: var(--bold); }
  .title td:last-child { border-right: var(--bold); }
  tbody tr:last-child td { border-bottom: var(--bold); }
  td.rest { text-align: center; min-width: 76px; font-weight: 700; }
  td.rest.zero { background: var(--zero); color: #0f4d2c; }
  td.rest.none { background: var(--left); color: #fff; }
  td.rest.off { background: #e8e8e8; color: #555; }
  tr.me td.name { background: #fff3c4; }
  .s { display: none; }
  /* 폰 화면의 표만 짧은 글자(✔, 25/일, 3회)로. 이미지(#shotArea)는 폰에서 만들어도 PC 모양 그대로 */
  @media (max-width: 600px) {
    .wrap { padding: 12px; } .card { padding: 12px; }
    #board .l { display: none; } #board .s { display: inline; }
    #board table { table-layout: fixed; font-size: 15px; letter-spacing: -0.03em; }
    #board th, #board td { height: 38px; padding: 0 2px; }
    #board td.d, #board td.rest { min-width: 0; }
    #board col.c-name { width: 19%; } #board col.c-goal { width: 11%; } #board col.c-rest { width: 12%; }
    #board thead th { font-size: 14px; line-height: 1.15; height: 42px; }
    #board thead th small { display: block; font-size: 11px; font-weight: 500; color: #7a4a4a; }
    #board td.d.on { font-size: 18px; }
    #board td.goal { font-size: 13px; color: #555; }
    #board .title td { font-size: 18px; height: 48px; }
  }
  #shotArea { position: fixed; left: -10000px; top: 0; width: 780px; background: #fff; }
  .foot { font-size: 12px; color: var(--sub); margin-top: 8px; text-align: right; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
           align-items: center; justify-content: center; padding: 16px; z-index: 9; }
  .modal.show { display: flex; }
  .modal .box { background: #fff; border-radius: 14px; padding: 16px; max-width: 100%; max-height: 100%; overflow: auto; text-align: center; }
  .modal img { max-width: 100%; border: 1px solid var(--line); }
  .modal p { margin: 8px 0; font-size: 14px; color: var(--sub); }
  .modal .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .modal a, .modal button { padding: 10px 16px; border-radius: 10px; font-weight: 700; text-decoration: none; }
  .modal a { background: var(--red); color: #fff; }
  .modal button { background: #eee; }
  .modal button.share { background: #fee500; color: #191919; }
  /* 인증 축하 팝업 */
  #cheerPop .box { width: 340px; padding: 24px 18px 18px; }
  #cheerPop .cheer { font-size: 20px; color: #0f4d2c; }
  #cheerPop .verse { font-size: 16px; margin-top: 14px; }
  #cheerPop .ok { margin-top: 16px; width: 100%; background: var(--red); color: #fff; padding: 12px; font-size: 16px; }
  /* 마지막 주: 다음 달 도전/쉼 묻기 */
  #cheerPop .ask { margin-top: 16px; border-top: 1px dashed #ddd; padding-top: 14px; font-size: 17px; font-weight: 700; line-height: 1.5; }
  #cheerPop .ask .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  #cheerPop .ask button { padding: 14px 8px; font-size: 16px; background: #eef4fb; color: #18406b; }
  #cheerPop .ask button[data-next=go] { background: var(--done); color: #4a2300; }
  #nextBox { margin-top: 14px; border-top: 1px dashed #ddd; padding-top: 12px; font-size: 15px; line-height: 1.6; }
  #nextBox h3 { font-size: 15px; margin: 0 0 8px; }
  #nextBox .row { padding: 8px 10px; border-radius: 10px; margin-bottom: 6px; background: #f7f7f7; color: var(--ink); font-size: 15px; }
  #nextBox .row.go { background: #fdeee0; } #nextBox .row.rest { background: #eef4fb; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>💪 히어로 운동 챌린지</h1>

  <div class="card">
    <div class="form">
      <div>
        <label for="name">이름</label>
        <select id="name"><option value="">이름을 골라 주세요</option></select>
      </div>
      <div>
        <label for="date">운동한 날짜</label>
        <input type="date" id="date">
      </div>
      <button class="go" id="go">오운완 인증!</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="bar">
      <button class="nav" id="prev">◀ 지난주</button>
      <span class="wk" id="wk"></span>
      <button class="nav" id="next">다음주 ▶</button>
    </div>
    <div id="mine"></div>
  </div>

  <button class="allbtn" id="all">📋 전체 표 보기</button>
  <div class="card adminCard">
    <h2>📋 전체 표</h2>
    <div class="scroll"><div id="board"></div></div>
    <div id="nextBox"></div>
    <div class="bar" style="margin-top:10px;margin-bottom:0">
      <span class="foot" id="stamp"></span>
      <button class="save" id="save">📷 표 이미지 만들기</button>
    </div>
  </div>
</div>
<div id="shotArea"></div>

<div class="modal" id="cheerPop">
  <div class="box">
    <div id="cheerBody"></div>
    <button class="ok" id="cheerOk">확인</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <img id="shot" alt="표 이미지">
    <p>휴대폰은 이미지를 꾹 눌러 저장하거나 공유하세요.</p>
    <div class="row">
      <button class="share" id="share" style="display:none">카톡 등으로 보내기</button>
      <a id="dl" download="히어로운동챌린지.png">내려받기</a>
      <button id="close">닫기</button>
    </div>
  </div>
</div>

<script>
// 데이터는 슈파베이스 「룡룡룡」의 hero_* 표. 표는 막혀 있고 함수 4개(hero_data·hero_submit·hero_set_goal·hero_set_next)로만 읽고 쓴다.
// 아래 키는 공개용(publishable) 키라 화면에 있어도 된다.
const SB_URL = 'https://trlnatdkebjvgiqneulv.supabase.co';
const SB_KEY = 'sb_publishable_BqE1VCDg50oi9zCflCjMuw_wYF55CTj';

let state = null;
const $ = id => document.getElementById(id);

function rpc(fn, args) {
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  }).then(r => r.json().then(j => { if (!r.ok) throw new Error(j.message || r.status); return j; }));
}

const api = (fn, a, b) =>
  fn === 'getWeek' ? getWeek(a)
  : fn === 'submit' ? rpc('hero_submit', { p_name: a, p_date: b })
  : rpc('hero_set_goal', { p_name: a, p_goal: b });

/**
 * 한 주치 화면 데이터 (예전 Code.gs readWeek_와 같은 계산). 한 주는 주일~토.
 * members[].goal = 그 주 결단, round = 이 주가 든 기수, hist[이름] = 기수 1주차~이 주까지 [{ wk, cnt, goal }].
 */
function getWeek(weekStart) {
  const guess = weekStart || sundayOf(new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }));
  // 기수는 한 달이라 7주 앞까지만 가져오면 1주차부터 다 들어온다
  return rpc('hero_data', { p_from: addDays(guess, -49), p_to: addDays(guess, 6) }).then(d => {
    const start = weekStart || sundayOf(d.today);
    const days = [...Array(7)].map((_, i) => addDays(start, i));
    const changes = {};
    d.changes.forEach(c => (changes[c.name] = changes[c.name] || []).push(c));
    const goalFor = (m, wk) => {
      let g = m.goal, off = false;
      (changes[m.name] || []).forEach(c => {
        if (c.from > wk) return;
        if (c.goal === 0) { if (c.from === wk) off = true; }
        else { g = c.goal; if (c.from === wk) off = false; }
      });
      return off ? 0 : g; // 0 = 휴무(그 주만)
    };
    const r = d.rounds.filter(x => x.start <= start && start <= x.end).pop();
    let round = null;
    if (r) {
      const weeks = [];
      for (let wk = sundayOf(r.start); wk <= r.end; wk = addDays(wk, 7)) weeks.push(wk);
      round = { name: r.name, start: r.start, end: r.end, weeks };
    }
    const weeks = round ? round.weeks.filter(wk => wk <= start) : [start];
    const byWeek = {}; // 이름 → 주 → 날짜 → true
    d.records.forEach(([name, date]) => {
      if (date < weeks[0] || date > days[6]) return;
      const mine = byWeek[name] = byWeek[name] || {}, wk = sundayOf(date);
      (mine[wk] = mine[wk] || {})[date] = true;
    });
    const done = {}, hist = {};
    d.members.forEach(m => {
      const mine = byWeek[m.name] || {};
      done[m.name] = mine[start] || {};
      hist[m.name] = weeks.map(wk => ({ wk, cnt: Object.keys(mine[wk] || {}).length, goal: goalFor(m, wk) }));
    });
    const members = d.members.map(m => ({ name: m.name, goal: goalFor(m, start) }));
    return { today: d.today, weekStart: start, days, members, done, round, hist, next: nextInfo(d) };
  });
}

// 오늘 기수의 마지막 주부터 다음 달 도전/쉼을 묻는다. 새 기수를 넣기 전까지는 계속 묻고 보여 준다.
function nextInfo(d) {
  const r = d.rounds.filter(x => x.start <= d.today).pop();
  if (!r || d.today < sundayOf(r.end)) return null;
  const n = parseInt(r.name, 10), choices = {};
  (d.nextChoices || []).forEach(c => { if (c.round === r.name) choices[c.name] = c.choice; });
  return { round: r.name, label: n ? (n % 12 + 1) + '월' : '다음 달', choices };
}

function md(ymd) { const p = ymd.split('-'); return (+p[1]) + '/' + (+p[2]); }
function addDays(ymd, n) {
  const p = ymd.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  return d.toISOString().slice(0, 10);
}
const wd = d => '일월화수목금토'[new Date(d + 'T00:00:00Z').getUTCDay()];
// .l = 넓은 화면 글자, .s = 폰 글자
const two = (l, s) => '<span class="l">' + l + '</span><span class="s">' + s + '</span>';

function render(w) {
  state = w;
  // 이번 주 기록은 폰에 기억해 두고, 다음에 열 때 먼저 보여 준다.
  if (w.days.indexOf(w.today) >= 0) try { localStorage.setItem('heroWeek', JSON.stringify(w)); } catch (e) {}
  const sel = $('name');
  if (sel.options.length === 1) {
    w.members.forEach(m => sel.add(new Option(m.name, m.name)));
    try { const saved = localStorage.getItem('heroName'); if (saved) sel.value = saved; } catch (e) {}
    $('date').value = w.today;
  }
  $('date').max = w.today;
  $('date').min = addDays(w.today, -14);

  $('wk').textContent = md(w.days[0]) + ' ~ ' + md(w.days[6]);
  $('next').disabled = w.days[6] >= w.today;

  renderMine(w);
  $('board').innerHTML = tableHtml(w, $('name').value);
  $('nextBox').innerHTML = nextHtml(w);
  $('stamp').textContent = '불러온 시각 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

// 내 기록: 이번 주 몇 번 했고, 남은 날로 결단을 채울 수 있는지
function renderMine(w) {
  const me = $('name').value, box = $('mine');
  const m = w.members.find(x => x.name === me);
  if (!m) { box.innerHTML = '<p class="hint">위에서 이름을 고르면 내 기록이 나와요.</p>'; return; }
  const done = w.done[me] || {};
  const cnt = w.days.filter(d => done[d]).length;
  const need = Math.max(0, m.goal - cnt);
  const open = w.days.filter(d => d >= w.today && !done[d]).length; // 오늘 포함, 아직 안 한 남은 날
  const left = '남은 ' + need + '회 · 남은 날 ' + open + '일 (오늘 포함)';
  let cls, t, u = left;
  const off = m.goal === 0; // 휴무 주
  if (off) { cls = 'safe'; t = '🌴 이번 주는 휴무예요'; u = '다음 주에 원래 결단으로 다시 시작해요'; }
  else if (need === 0) { cls = 'good'; t = '🎉 결단 달성!'; u = '수고하셨어요. 더 하면 보너스 💪'; }
  else if (w.days[6] < w.today) { cls = 'bad'; t = '이 주는 ' + need + '회 모자랐어요'; u = '이번 주에 다시 힘내요!'; }
  else if (need >= open) { cls = 'bad'; t = need === open ? '🔴 위험! 남은 날 매일 해야 해요' : '🔴 위험!'; }
  else if (need === open - 1) { cls = 'warn'; t = '🟠 아슬아슬해요'; }
  else { cls = 'safe'; t = '🟢 여유 있어요'; }
  const goalTxt = off ? '휴무' : '주 ' + m.goal + '회';
  let h = '<div class="score"><b>' + cnt + '</b><span> / ' + goalTxt + '</span></div>' +
          '<div class="status ' + cls + '"><div class="t">' + t + '</div><div class="u">' + u + '</div></div><div class="week7">';
  w.days.forEach(d => {
    const c = ['day', done[d] ? 'on' : '', d === w.today ? 'today' : '', d > w.today ? 'future' : ''].join(' ');
    h += '<div class="' + c + '"><div class="w">' + wd(d) + '</div><div class="c">' + (done[d] ? '✔' : +d.slice(8)) + '</div></div>';
  });
  h += '</div>';

  // 결단 바꾸기: 이번 주를 볼 때만
  if (w.days.indexOf(w.today) >= 0) {
    h += '<div class="goalrow">내 결단 <b>' + goalTxt + '</b><button class="chg" data-act="pick">결단 바꾸기</button></div>' +
         '<div class="picker" id="picker"><div class="chips">' +
         [0, 3, 4, 5, 6, 7].map(n => '<button data-goal="' + n + '"' + (n === 0 ? ' class="offbtn' + (off ? ' cur' : '') + '"' : n === m.goal ? ' class="cur"' : '') + '>' + (n || '휴무') + '</button>').join('') +
         '</div><p>횟수는 <b>이번 주부터 계속</b>, 휴무는 <b>이번 주만</b> 적용돼요.</p></div>';
  }

  // 이번 기수 주차별 결과
  const hist = w.round && w.hist && w.hist[me];
  if (hist && hist.length) {
    const nowWk = addDays(w.today, -new Date(w.today + 'T00:00:00Z').getUTCDay());
    h += '<div class="hist"><h3>🏁 ' + esc(w.round.name || '이번 기수') + '</h3>';
    hist.forEach((x, i) => {
      const range = md(x.wk) + '~' + md(addDays(x.wk, 6));
      let cls, txt;
      if (x.goal === 0) { cls = 'off'; txt = '🌴 휴무'; }
      else if (x.cnt >= x.goal) { cls = 'ok'; txt = '✅ 완수'; }
      else if (x.wk >= nowWk) { cls = 'now'; txt = '진행 중 ' + x.cnt + '/' + x.goal + '회'; }
      else { cls = 'no'; txt = '미완수 (' + x.cnt + '/' + x.goal + '회)'; }
      h += '<div class="row ' + cls + '"><span>' + (i + 1) + '주차<small>' + range + '</small></span><b>' + txt + '</b></div>';
    });
    h += '</div>';
  }
  box.innerHTML = h;
}

function tableHtml(w, me) {
  let h = '<table><colgroup><col class="c-name"><col class="c-goal">' + '<col>'.repeat(w.days.length) +
          '<col class="c-rest"></colgroup><thead><tr class="title"><td colspan="' + (w.days.length + 3) +
          '">💪 히어로 운동 챌린지</td></tr><tr><th>' + two('참가자', '이름') + '</th><th>결단</th>';
  w.days.forEach(d => h += '<th class="' + (d === w.today ? 'today' : '') + '">' +
    two(md(d), (+d.slice(8)) + '<small>' + wd(d) + '</small>') + '</th>');
  h += '<th>' + two('남은 횟수', '남은') + '</th></tr></thead><tbody>';
  w.members.forEach(m => {
    const mine = w.done[m.name] || {};
    let cnt = 0;
    h += '<tr' + (m.name === me ? ' class="me"' : '') + '><td class="name">' + esc(m.name) + '</td><td class="goal">' +
         (m.goal ? two('주 ' + m.goal + '회', m.goal + '회') : '휴무') + '</td>';
    w.days.forEach(d => { const on = !!mine[d]; if (on) cnt++;
      h += '<td class="d' + (on ? ' on' : '') + '">' + (on ? two('오운완', '✔') : '') + '</td>'; });
    const rest = Math.max(0, m.goal - cnt);
    const cls = !m.goal ? 'off' : rest === 0 ? 'zero' : (cnt === 0 ? 'none' : '');
    h += '<td class="rest ' + cls + '">' + (m.goal ? rest + '회' : '휴무') + '</td></tr>';
  });
  return h + '</tbody></table>';
}

// 전체 표 아래: 누가 도전하고 누가 쉬는지 (표 이미지에는 안 들어간다)
function nextHtml(w) {
  if (!w.next) return '';
  const who = c => w.members.filter(m => (w.next.choices[m.name] || '') === c).map(m => esc(m.name));
  const row = (cls, title, names) => '<div class="row ' + cls + '"><b>' + title + ' ' + names.length + '명</b><br>' + (names.join(', ') || '-') + '</div>';
  const go = who('go'), rest = who('rest'), none = who('');
  return '<h3>🙋 ' + esc(w.next.label) + ' 참여 응답 (' + (go.length + rest.length) + '/' + w.members.length + '명)</h3>' +
         row('go', '💪 도전', go) + row('rest', '🌴 쉼', rest) + row('', '❔ 아직 응답 안 함', none);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function load(weekStart, keep) {
  if (!keep) $('mine').innerHTML = $('board').innerHTML = '<p class="hint">불러오는 중…</p>';
  api('getWeek', weekStart || null).then(render).catch(e => showMsg('err', '기록을 못 불러왔어요: ' + (e.message || e)));
}

function showMsg(kind, text) { const m = $('msg'); m.className = 'msg ' + kind; m.textContent = text; }

// 격려 성경 구절 (개역개정). 상황별로 매번 다르게, 바로 전 구절은 다시 안 나오게.
const VERSES = {
  go: [ // 평소 인증
    ['내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라', '빌립보서 4:13'],
    ['그런즉 너희 몸으로 하나님께 영광을 돌리라', '고린도전서 6:20'],
    ['너희가 먹든지 마시든지 무엇을 하든지 다 하나님의 영광을 위하여 하라', '고린도전서 10:31'],
    ['오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리가 날개치며 올라감 같을 것이요', '이사야 40:31'],
    ['피곤한 자에게는 능력을 주시며 무능한 자에게는 힘을 더하시나니', '이사야 40:29'],
    ['여호와로 인하여 기뻐하는 것이 너희의 힘이니라', '느헤미야 8:10'],
    ['이 하나님이 힘으로 내게 띠 띠우시며 내 길을 완전하게 하시며', '시편 18:32'],
    ['힘 있게 허리를 묶으며 자기의 팔을 강하게 하며', '잠언 31:17'],
    ['사랑하는 자여 네 영혼이 잘됨 같이 네가 범사에 잘되고 강건하기를 내가 간구하노라', '요한삼서 1:2'],
    ['강하고 담대하라 두려워하지 말며 놀라지 말라 네가 어디로 가든지 네 하나님 여호와가 너와 함께 하느니라', '여호수아 1:9'],
  ],
  left: [ // 아직 남았을 때
    ['선을 행하되 낙심하지 말지니 포기하지 아니하면 때가 이르매 거두리라', '갈라디아서 6:9'],
    ['인내로써 우리 앞에 당한 경주를 하며', '히브리서 12:1'],
    ['너희도 상을 받도록 이와 같이 달음질하라', '고린도전서 9:24'],
    ['푯대를 향하여 그리스도 예수 안에서 하나님이 위에서 부르신 부름의 상을 위하여 달려가노라', '빌립보서 3:14'],
  ],
  done: [ // 결단 달성
    ['나는 선한 싸움을 싸우고 나의 달려갈 길을 마치고 믿음을 지켰으니', '디모데후서 4:7'],
    ['잘하였도다 착하고 충성된 종아', '마태복음 25:21'],
  ],
  rest: [ // 휴무
    ['수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라', '마태복음 11:28'],
    ['그가 나를 푸른 풀밭에 누이시며 쉴 만한 물 가로 인도하시는도다', '시편 23:2'],
  ],
};
function verseHtml(kind) {
  let pool = kind === 'left' ? VERSES.left.concat(VERSES.go) : VERSES[kind];
  let last = ''; try { last = localStorage.getItem('heroVerse') || ''; } catch (e) {}
  const pick = pool.filter(v => v[1] !== last);
  const v = (pick.length ? pick : pool)[Math.floor(Math.random() * (pick.length || pool.length))];
  try { localStorage.setItem('heroVerse', v[1]); } catch (e) {}
  return '<div class="verse ' + (kind === 'done' ? 'done' : kind === 'rest' ? 'rest' : '') + '">「' + v[0] + '」<cite>' + v[1] + '</cite></div>';
}
// 위: 「OO님 10/28 오운완!」 줄바꿈 「이번 주 N번 남았어요 / 결단 달성」, 아래: 구절
function showCheer(w, name, date) {
  const m = w.members.find(x => x.name === name) || { goal: 0 };
  const cnt = Object.keys(w.done[name] || {}).length;
  let line2 = '', kind = 'go';
  if (m.goal > 0 && cnt >= m.goal) { line2 = cnt === m.goal ? '이번 주 결단 달성 🎉' : '결단 넘어 보너스 운동 🔥'; kind = 'done'; }
  else if (m.goal > 0) { line2 = '이번 주 ' + (m.goal - cnt) + '번 남았어요'; kind = 'left'; }
  showMsg('', '');
  // 마지막 주에 아직 응답 안 한 사람에게만 다음 달을 묻는다
  const ask = w.next && !w.next.choices[name];
  $('cheerBody').innerHTML = '<div class="cheer">' + esc(name) + '님 ' + md(date) + ' 오운완!' + (line2 ? '<br>' + line2 : '') + '</div>' + verseHtml(kind) +
    (ask ? '<div class="ask" id="ask">' + esc(w.next.label) + '에도 도전하시나요?<div class="btns"><button data-next="go">💪 도전할게요</button><button data-next="rest">🌴 쉴게요</button></div></div>' : '');
  $('cheerOk').hidden = !!ask; // 물을 때는 답해야 닫힌다
  $('cheerPop').classList.add('show');
}
// 다음 달 응답: 화면 먼저 바꾸고 뒤에서 저장, 실패하면 되돌려 다시 묻는다.
$('cheerBody').onclick = ev => {
  const b = ev.target.closest('button[data-next]');
  if (!b || !state.next) return;
  const name = $('name').value, n = state.next, choice = b.dataset.next, box = $('ask'), before = box.innerHTML;
  n.choices[name] = choice;
  render(state);
  box.textContent = n.label + (choice === 'go' ? '도 화이팅입니다 💪' : '은 쉬는 걸로 받았어요 🌴');
  $('cheerOk').hidden = false;
  rpc('hero_set_next', { p_name: name, p_round: n.round, p_choice: choice }).catch(e => {
    delete n.choices[name];
    render(state);
    box.innerHTML = before + '<div class="msg err">저장이 안 됐어요. 다시 눌러 주세요</div>';
    $('cheerOk').hidden = true;
  });
};

$('go').onclick = () => {
  const name = $('name').value, date = $('date').value;
  if (!name) return showMsg('err', '이름을 골라 주세요.');
  if (!date) return showMsg('err', '날짜를 골라 주세요.');
  try { localStorage.setItem('heroName', name); } catch (e) {}
  // 서버 저장은 1~2초 걸리므로, 보고 있는 주의 날짜면 화면에 먼저 반영하고 뒤에서 저장한다. 실패하면 되돌린다.
  const wk = sundayOf(date);
  const inView = state && state.weekStart === wk;
  const mine = inView ? (state.done[name] = state.done[name] || {}) : null;
  if (inView && mine[date]) return showMsg('ok', name + '님 ' + md(date) + '은 이미 인증돼 있어요 👍');
  if (inView) { mine[date] = true; bumpHist(name, wk, 1); render(state); showCheer(state, name, date); }
  else showMsg('', '저장하는 중…');
  $('go').disabled = true;
  api('submit', name, date).then(r => {
    if (!inView) return api('getWeek', wk).then(w => {
      render(w);
      if (r.already) showMsg('ok', name + '님 ' + md(date) + '은 이미 인증돼 있어요 👍'); else showCheer(w, name, date);
    });
  }).catch(e => {
    if (inView) { delete mine[date]; bumpHist(name, wk, -1); render(state); }
    showMsg('err', '저장이 안 됐어요. 다시 눌러 주세요 (' + (e.message || e) + ')');
  }).finally(() => { $('go').disabled = false; });
};
function sundayOf(d) { return addDays(d, -new Date(d + 'T00:00:00Z').getUTCDay()); }
function bumpHist(name, wk, n) {
  const x = ((state.hist && state.hist[name]) || []).find(h => h.wk === wk);
  if (x) x.cnt += n;
}
$('name').onchange = () => {
  try { if ($('name').value) localStorage.setItem('heroName', $('name').value); } catch (e) {}
  if (state) render(state);
};
// 결단 바꾸기 (내 기록 카드 안의 버튼들)
$('mine').onclick = ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.act === 'pick') return $('picker').classList.toggle('show');
  const goal = +b.dataset.goal, name = $('name').value; // 0 = 휴무
  if (b.dataset.goal === undefined || !name) return;
  // 화면 먼저 바꾸고 뒤에서 저장, 실패하면 되돌린다.
  const m = state.members.find(x => x.name === name);
  if (!m) return;
  const h = ((state.hist && state.hist[name]) || []).find(x => x.wk === state.weekStart);
  const before = [m.goal, h && h.goal];
  m.goal = goal; if (h) h.goal = goal;
  render(state);
  const p = document.createElement('div'); p.className = 'hint';
  p.innerHTML = goal === 0 ? '<div class="cheer">이번 주는 휴무로 바꿨어요</div>' + verseHtml('rest')
                           : '<div class="cheer">결단을 주 ' + goal + '회로 바꿨어요</div>';
  $('mine').querySelector('.goalrow').after(p);
  api('setGoal', name, goal).catch(e => {
    m.goal = before[0]; if (h) h.goal = before[1];
    render(state);
    showMsg('err', '결단이 저장 안 됐어요. 다시 해 주세요 (' + (e.message || e) + ')');
  });
};
$('prev').onclick = () => load(addDays(state.weekStart, -7));
$('next').onclick = () => load(addDays(state.weekStart, 7));

// 이미지는 화면 밖의 넓은 표(780px)를 찍어서, 폰에서 만들어도 시트 캡처처럼 깔끔하게 나온다.
let shotFile = null;
$('save').onclick = () => {
  const btn = $('save'); btn.disabled = true; btn.textContent = '만드는 중…';
  $('shotArea').innerHTML = tableHtml(state, '');
  const fname = '히어로운동챌린지_' + md(state.days[0]).replace('/', '-') + '.png';
  document.fonts.ready
    .then(() => html2canvas($('shotArea'), { scale: 2, backgroundColor: '#ffffff', windowWidth: 1000 }))
    .then(c => {
      const url = c.toDataURL('image/png');
      $('shot').src = url; $('dl').href = url; $('dl').download = fname;
      $('modal').classList.add('show');
      return new Promise(ok => c.toBlob(ok, 'image/png'));
    })
    .then(blob => {
      shotFile = new File([blob], fname, { type: 'image/png' });
      const can = !!(navigator.canShare && navigator.canShare({ files: [shotFile] }));
      $('share').style.display = can ? '' : 'none';
    })
    .finally(() => { btn.disabled = false; btn.textContent = '📷 표 이미지 만들기'; });
};
$('share').onclick = () => {
  navigator.share({ files: [shotFile] }).catch(e => {
    if (e.name !== 'AbortError') { $('share').style.display = 'none'; showMsg('err', '바로 보내기가 안 돼요. 이미지를 꾹 눌러 저장해 주세요.'); }
  });
};
$('close').onclick = () => $('modal').classList.remove('show');
// 축하 팝업은 확인 또는 바깥을 누르면 닫힘
$('cheerOk').onclick = () => $('cheerPop').classList.remove('show');
$('cheerPop').onclick = ev => { if (ev.target === $('cheerPop') && !$('cheerOk').hidden) $('cheerPop').classList.remove('show'); };

$('all').onclick = () => {
  const on = document.body.classList.toggle('showAll');
  $('all').textContent = on ? '전체 표 닫기' : '📋 전체 표 보기';
  if (on) document.querySelector('.adminCard').scrollIntoView({ behavior: 'smooth' });
};

function start() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('heroWeek')); } catch (e) {}
  // 기억해 둔 게 이번 주 것일 때만 먼저 보여 준다 (날짜 기본값이 어제로 남지 않게 오늘로 맞춤).
  const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
  const ok = saved && saved.days && saved.days.indexOf(today) >= 0;
  if (ok) { saved.today = today; render(saved); $('stamp').textContent = '최신 기록 확인 중…'; }
  load(null, ok);
}
start();
</script>
</body>
</html>
